services:
  preck:
    image: ghcr.io/tontsa28/preck:latest
    environment:
      - PID_FILE=
    restart: unless-stopped
    container_name: preck
    ports:
    - 80:8081

  watchtower:
    image: nickfedor/watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: watchtower